name: "2) 18:30 NXT 매수 신호"

on:
  schedule:
    # 매일 09:30 UTC = 18:30 KST (월~금)
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-buy
  cancel-in-progress: false

jobs:
  buy:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v5

      - name: 파이썬 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: NXT 매수 신호 생성
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py buy

      - name: 결과 커밋 & 푸시 (docs/data, data)
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 18:30 매수 신호 갱신 [skip ci]"
          git pull --rebase
          git push
