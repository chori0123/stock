name: "0) 주간 백테스트 (전략 유효성 재검증)"

on:
  schedule:
    # 매주 토요일 01:00 UTC = 토요일 10:00 KST
    - cron: "0 1 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt pyarrow

      - name: 과거 데이터 캐시 (올해 파일만 매주 새로 받음)
        uses: actions/cache@v4
        with:
          path: data/cache
          key: marcap-${{ github.run_id }}
          restore-keys: marcap-

      - name: 11년 백테스트 실행 (FinanceData/marcap 공개 데이터, KRX 로그인 불필요)
        run: python backtest.py

      - name: 결과 커밋 & 푸시 (model.json, 리포트)
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/model.json docs/backtest.html docs/data/backtest_summary.json
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 주간 백테스트 결과 갱신 [skip ci]"
          git pull --rebase
          git push
