name: "3) 08:30 익일 장초 매도 신호"

on:
  schedule:
    # 매일 23:30 UTC(일~목) = 08:30 KST(월~금). KST가 UTC+9라 날짜가 하루 당겨진다.
    - cron: "30 23 * * 0-4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: stock-screener-sell
  cancel-in-progress: false

jobs:
  sell:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 익일 장초 매도 신호 생성
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py sell

      - name: 결과 커밋 & 푸시 (docs/data, data)
        run: |
          git config user.name "stock-screener-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data data
          git diff --cached --quiet && echo "변경사항 없음" || git commit -m "chore: 08:30 매도 신호 갱신 [skip ci]"
          git pull --rebase
          git push
